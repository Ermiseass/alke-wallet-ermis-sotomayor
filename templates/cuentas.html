{% extends 'base.html' %}{% block content %}<div class="section-heading"><h1>Mis cuentas</h1><a class="button" href="{% url 'cuenta_crear' %}">+ Crear cuenta</a></div><div class="cards">{% for c in object_list %}<section class="panel"><p class="eyebrow">CUENTA {{ c.pk }}</p><h2>{{ c.alias }}</h2><h2>$ {{ c.saldo|floatformat:2 }}</h2><div class="actions"><a href="{% url 'cuenta_detalle' c.pk %}">Detalle</a><a href="{% url 'cuenta_editar' c.pk %}">Editar</a><a href="{% url 'cuenta_eliminar' c.pk %}">Eliminar</a></div></section>{% empty %}<p>No tienes cuentas. Crea la primera.</p>{% endfor %}</div>{% endblock %}
