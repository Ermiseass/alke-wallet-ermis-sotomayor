<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Operación</th><th>Cuenta origen</th><th>Destino</th><th>Monto CLP</th></tr></thead><tbody>{% for m in movimientos %}<tr><td>{{ m.creada|date:'d/m/Y H:i' }}</td><td><span class="tag">{{ m.get_tipo_display }}</span><small class="description">{{ m.descripcion }}</small></td><td>{{ m.cuenta.alias }}</td><td>{{ m.destino.alias|default:'—' }}</td><td class="money">$ {{ m.monto|floatformat:2 }}</td></tr>{% empty %}<tr><td colspan="5">Aún no hay movimientos.</td></tr>{% endfor %}</tbody></table></div>
